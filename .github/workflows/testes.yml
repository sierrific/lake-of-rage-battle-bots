name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  painel_windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe do instalador (PowerShell 5.1)
        shell: powershell
        run: |
          $erros = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\windows\instalar.ps1", [ref]$null, [ref]$erros)
          if ($erros.Count) { throw ($erros | Out-String) }
      - name: Instalador em outro disco (escolha da pasta e .wslconfig)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ast = [System.Management.Automation.Language.Parser]::ParseFile("$PWD\windows\instalar.ps1", [ref]$null, [ref]$null)
          foreach ($f in $ast.FindAll({ param($n) $n -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)) {
            . ([scriptblock]::Create($f.Extent.Text))
          }
          $GB = 1GB; $PrecisaGB = 8; $Pasta = "$env:RUNNER_TEMP\lor"; $Sistema = $env:SystemDrive.ToUpper()
          $CApertadoGB = 0
          if ((PastaWslPadrao) -ne "$Pasta\wsl") { throw "com espaco no C: devia ficar no C: ($(PastaWslPadrao))" }
          $env:LOR_PASTA_WSL = 'D:\X'
          if ((PastaWslPadrao) -ne 'D:\X\wsl') { throw "LOR_PASTA_WSL ignorada ($(PastaWslPadrao))" }
          $env:LOR_PASTA_WSL = $null
          $CApertadoGB = 1000000; $PrecisaGB = 1000000
          if ($null -ne (PastaWslPadrao)) { throw 'sem espaco em disco nenhum devia devolver nada' }
          if ((Unidade 'd:\LoRBots\wsl') -ne 'D:') { throw 'Unidade' }
          if (-not (MesmaPasta 'C:\a\b\' 'c:\a\b')) { throw 'MesmaPasta' }
          $env:USERPROFILE = "$env:RUNNER_TEMP\perfil"; New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $cfg = "$env:USERPROFILE\.wslconfig"
          SwapForaDoC 'D:\LoRBots\wsl'
          $t = (Get-Content $cfg) -join '|'
          if ($t -ne '[wsl2]|swapFile=D:\\LoRBots\\swap.vhdx') { throw "novo: $t" }
          Set-Content $cfg "[wsl2]`nmemory=4GB`n[experimental]`nx=1"
          SwapForaDoC 'E:\LoRBots\wsl'
          $t = (Get-Content $cfg) -join '|'
          if ($t -ne '[wsl2]|swapFile=E:\\LoRBots\\swap.vhdx|memory=4GB|[experimental]|x=1') { throw "existente: $t" }
          SwapForaDoC 'F:\LoRBots\wsl'
          if (((Get-Content $cfg) -join '|') -ne $t) { throw 'mexeu num swapFile que ja existia' }
          # Acentos (no nosso caminho e no que ja estava no arquivo) sobrevivem; o arquivo fica UTF-8.
          $jo = 'Jo' + [char]0x00E3 + 'o'
          [IO.File]::WriteAllText($cfg, "[wsl2]`r`nkernel=C:\\$jo\\kernel`r`n", (New-Object Text.UTF8Encoding $false))
          SwapForaDoC "D:\$jo\LoRBots\wsl"
          $t = [IO.File]::ReadAllLines($cfg) -join '|'
          if ($t -ne "[wsl2]|swapFile=D:\\$jo\\LoRBots\\swap.vhdx|kernel=C:\\$jo\\kernel") { throw "acento: $t" }
          $b = [IO.File]::ReadAllBytes($cfg)
          if ($b[0] -eq 0xEF) { throw 'gravou BOM no .wslconfig' }
          if ([Text.Encoding]::UTF8.GetString($b) -notmatch $jo) { throw 'nao gravou em UTF-8' }
          # Sem espaco no destino, a mudanca para antes de mexer na distribuicao.
          function Wsl { throw "chamou o wsl: $args" }
          function Falha($texto) { throw "FALHA: $texto" }
          function Passo($texto) { }
          $orig = "$env:RUNNER_TEMP\orig"; New-Item -ItemType Directory -Force $orig | Out-Null
          $PrecisaGB = 1000000  # sem ext4.vhdx, o tamanho estimado e $PrecisaGB: nenhum disco cabe
          try { MoverDistro "$env:SystemDrive\nao-cabe\wsl" $orig; throw 'devia ter falhado' }
          catch { if ("$_" -notmatch '^FALHA: .*Nada foi apagado') { throw "mudanca sem espaco: $_" } }
          if (Test-Path "$env:SystemDrive\nao-cabe") { throw 'criou a pasta antes de conferir o espaco' }
      - name: Painel nativo (PowerShell 5.1, C# 5, layouts, temas e comandos simulados)
        shell: powershell
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tests/test_panel_ui.ps1 -OutputDirectory "$env:RUNNER_TEMP/lor-panel-ui"
      - name: Login pelo navegador (PowerShell 5.1, CDP e cliente sinteticos)
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/test_login_navegador.ps1
      - name: Capturas sinteticas dos layouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: painel-windows-ui
          path: ${{ runner.temp }}/lor-panel-ui/*.png
          if-no-files-found: ignore

  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: zsh (o bot.sh do Ai-vgc é zsh) e numpy (treino-oponente.py)
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh python3-numpy

      - name: Sintaxe dos scripts
        run: |
          for f in linux/*.sh; do bash -n "$f"; done
          python3 -m py_compile linux/enviar-partidas.py linux/treino-oponente.py linux/backup-coleta.py linux/login-navegador.py

      - name: Testes (envio de partidas, parada do bot, reinício do painel)
        run: python3 -m unittest discover -s tests -v

      - name: Patch do Ai-vgc aplica no commit fixado
        run: |
          commit=$(sed -n 's/^AIVGC_COMMIT=//p' linux/instalar.sh)
          repo=$(sed -n 's/^AIVGC_REPO=//p' linux/instalar.sh)
          original=$(sed -n 's/^AIVGC_ORIGINAL=//p' linux/instalar.sh)
          git init -q /tmp/ai-vgc && cd /tmp/ai-vgc
          git remote add origin "$repo"
          git sparse-checkout set src/ai_vgc
          git fetch -q --depth 1 --filter=blob:none origin "$commit" \
            || git fetch -q --depth 1 --filter=blob:none "$original" "$commit"
          git checkout -q FETCH_HEAD
          git apply --check "$GITHUB_WORKSPACE/linux/ai-vgc-lor.patch"
          git apply "$GITHUB_WORKSPACE/linux/ai-vgc-lor.patch"
          python3 -m py_compile src/ai_vgc/nn/player.py
          python3 "$GITHUB_WORKSPACE/tests/ai_vgc/tempos_por_turno.py" src/ai_vgc/nn/player.py
          python3 "$GITHUB_WORKSPACE/tests/ai_vgc/login_navegador.py" src/ai_vgc/nn/player.py

      - name: PowerShell do Windows (sintaxe; acentos só com UTF-8 com BOM)
        shell: pwsh
        run: |
          $falhou = $false
          foreach ($f in Get-ChildItem windows -Filter *.ps1) {
            $erros = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$erros)
            foreach ($e in $erros) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $falhou = $true }
            $b = [IO.File]::ReadAllBytes($f.FullName)
            $bom = $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
            if (-not $bom -and ($b | Where-Object { $_ -gt 0x7F })) {
              Write-Host "$($f.Name): tem acentos mas não tem BOM (o PowerShell 5 do Windows os leria errado)"; $falhou = $true
            }
          }
          if ($falhou) { exit 1 }

  # O painel e o instalador baixam da branch estavel, não da main: ela só anda depois que todos os
  # testes passaram neste commit da main.
  estavel:
    needs: [painel_windows, testes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Avança a branch estavel para este commit
        run: |
          # Dois merges seguidos: se a estavel já está num commit mais novo, não volta para trás.
          if git fetch -q origin estavel 2>/dev/null && git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "estavel já está neste commit ou num mais novo"
            exit 0
          fi
          git push origin "HEAD:refs/heads/estavel"
